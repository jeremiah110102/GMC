<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grace Mission Church - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="background-gradient"></div>
    
    <div class="container">
        <div class="form-wrapper">
            <div class="form-header">
                <div class="logo-icon">⛪</div>
                <h1>Grace Mission Church</h1>
                <p class="subtitle">Member Login</p>
            </div>

            <form id="loginForm" class="registration-form">
                <div class="form-section">
                    <h2 class="section-title">Sign In</h2>
                    
                    <div class="form-group">
                        <label for="loginEmail">Email Address *</label>
                        <input type="email" id="loginEmail" name="loginEmail" required placeholder="your.email@example.com">
                        <span class="error-message"></span>
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Password *</label>
                        <input type="password" id="loginPassword" name="loginPassword" required placeholder="Enter your password">
                        <span class="error-message"></span>
                    </div>

                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="rememberMe" name="rememberMe">
                            <span>Remember me</span>
                        </label>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-icon">→</span>
                </button>

                <p class="form-footer">Don't have an account? <a href="register.html" class="link">Register here</a></p>
            </form>

            <!-- Success Message -->
            <div id="successMessage" class="success-message hidden">
                <div class="success-content">
                    <div class="success-icon">✓</div>
                    <h2>Welcome Back!</h2>
                    <p>You have successfully signed in. Redirecting...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
