<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grace Mission Church - Registration</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="background-gradient"></div>
    
    <div class="container">
        <div class="form-wrapper">
            <div class="form-header">
                <div class="logo-icon">⛪</div>
                <h1>Grace Mission Church</h1>
                <p class="subtitle">Join Our Community</p>
            </div>

            <form id="registrationForm" class="registration-form">
                <!-- Personal Information Section -->
                <div class="form-section">
                    <h2 class="section-title">Personal Information</h2>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstName">First Name *</label>
                            <input type="text" id="firstName" name="firstName" required placeholder="Enter your first name">
                            <span class="error-message"></span>
                        </div>
                        <div class="form-group">
                            <label for="lastName">Last Name *</label>
                            <input type="text" id="lastName" name="lastName" required placeholder="Enter your last name">
                            <span class="error-message"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" name="email" required placeholder="your.email@example.com">
                        <span class="error-message"></span>
                    </div>

                    <div class="form-group">
                        <label for="password">Password *</label>
                        <input type="password" id="password" name="password" required placeholder="Create a strong password">
                        <span class="error-message"></span>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password *</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm your password">
                        <span class="error-message"></span>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number *</label>
                        <input type="tel" id="phone" name="phone" required placeholder="+63 9XX XXX XXXX">
                        <span class="error-message"></span>
                    </div>

                    <div class="form-group">
                        <label for="birthDate">Date of Birth *</label>
                        <input type="date" id="birthDate" name="birthDate" required>
                        <span class="error-message"></span>
                    </div>
                </div>

                <!-- Address Section -->
                <div class="form-section">
                    <h2 class="section-title">Address</h2>
                    
                    <div class="form-group">
                        <label for="address">Street Address *</label>
                        <input type="text" id="address" name="address" required placeholder="123 Main Street">
                        <span class="error-message"></span>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="city">City *</label>
                            <input type="text" id="city" name="city" required placeholder="Quezon City">
                            <span class="error-message"></span>
                        </div>
                        <div class="form-group">
                            <label for="province">Province *</label>
                            <input type="text" id="province" name="province" required placeholder="Metro Manila">
                            <span class="error-message"></span>
                        </div>
                        <div class="form-group">
                            <label for="zipCode">Zip Code *</label>
                            <input type="text" id="zipCode" name="zipCode" required placeholder="1100">
                            <span class="error-message"></span>
                        </div>
                    </div>
                </div>

                <!-- Membership Section -->
                <div class="form-section">
                    <h2 class="section-title">Membership Details</h2>
                    
                    <div class="form-group">
                        <label for="membershipType">Membership Type *</label>
                        <select id="membershipType" name="membershipType" required>
                            <option value="">Select membership type</option>
                            <option value="active">Active Member</option>
                            <option value="associate">Associate Member</option>
                            <option value="visitor">Visitor</option>
                        </select>
                        <span class="error-message"></span>
                    </div>

                    <div class="form-group">
                        <label for="interests">Areas of Interest</label>
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" name="interests" value="worship">
                                <span>Worship</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="interests" value="youth">
                                <span>Youth Ministry</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="interests" value="community">
                                <span>Community Service</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="interests" value="prayer">
                                <span>Prayer Group</span>
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="message">Message for Us</label>
                        <textarea id="message" name="message" placeholder="Tell us a bit about yourself..." rows="4"></textarea>
                    </div>
                </div>

                <!-- Agreement Section -->
                <div class="form-section">
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="terms" name="terms" required>
                            <span>I agree to the terms and conditions *</span>
                        </label>
                        <span class="error-message"></span>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn">
                    <span class="btn-text">Register Now</span>
                    <span class="btn-icon">→</span>
                </button>

                <p class="form-footer">Already have an account? <a href="index.html" class="link">Sign in here</a></p>
            </form>

            <!-- Success Message -->
            <div id="successMessage" class="success-message hidden">
                <div class="success-content">
                    <div class="success-icon">✓</div>
                    <h2>Welcome to Grace Mission Church!</h2>
                    <p>Your registration has been successfully submitted. You can now sign in.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
